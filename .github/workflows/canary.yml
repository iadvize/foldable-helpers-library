name: Canary deployment

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  publish-canary:
    name: 'publish canary'
    runs-on: ubuntu-18.04

    steps:
    - uses: actions/checkout@a6747255bd19d7a757dbdda8c654a9f84db19839 # v2-beta

    - name: Compute canary version
      id: compute-version
      env:
        ID: ${{ github.sha }}
      run: |
        COMMIT=$(git rev-parse --short HEAD)
        NOW=$(date +%s%3N)

        CURRENT_VERSION=$(cat package.json | jq -r '.version')
        NEW_VERSION=$CURRENT_VERSION-canary-$COMMIT-$NOW

        NAME=$(cat package.json | jq -r '.name')

        echo "::set-output name=version::$NEW_VERSION"
        echo "::set-output name=name::$NAME"

    - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
      with:
        registry-url: https://registry.npmjs.org/
        node-verion: '12.x'

    - name: Cache npm cache
      uses: actions/cache@f5ce41475b483ad7581884324a6eca9f48f8dcc7 # v1.2.1
      with:
        path: ~/.npm
        key: v1-npm-${{ github.event.pull_request.head.ref }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          v1-npm-${{ github.event.pull_request.head.ref }}-
          v1-npm-

    - name: Install
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      run: npm ci

    - name: Bumb version
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        VERSION: ${{ steps.compute-version.outputs.version }}
      run: |
        npm version --no-git-tag-version $VERSION

    - name: Create deployment
      id: deployment
      uses: actions/github-script@83e4cfe60ad25a2d0637965c993eb54c325d6d8d # 0.4.0
      env:
        NAME: ${{ steps.compute-version.outputs.name }}
        VERSION: ${{ steps.compute-version.outputs.version }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN_REPO_WRITE }}
        previews: 'ant-man-preview,flash-preview'
        script: |
          const name = process.env.NAME;
          const version = process.env.VERSION;

          const branch = context.payload.pull_request.head.ref;

          const { data: deployment } = await github.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: branch,
            environment: 'npm',
            auto_merge: false,
            required_contexts: [],
            payload: {
              version,
              name,
              ref: context.payload.pull_request.head.sha,
              npmTag: branch,
            },
            description: `Deploy ${name}@${version} on npm`,
            production_environment: true,
          });
